<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="복잡한 재무제표를 쉬운 말로 설명하는 기업 분석 서비스 DeepCheck">
  <title>DeepCheck — 숫자 너머의 기업을 읽다</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .term-help { display:block; margin-top:4px; color:var(--muted); font-size:10px; line-height:1.45; }
    .section-help { display:block; max-width:540px; margin-top:6px; color:var(--muted); font-size:11px; line-height:1.55; font-weight:400; }
    .data-source-banner { width:min(1160px,90%); margin:0 auto 16px; padding:12px 16px; border:1px solid var(--line); border-radius:12px; background:#fff; color:var(--muted); font-size:12px; }
    .data-source-banner.success { border-color:#a9d4bd; background:#edf8f1; color:var(--green); }
    .data-source-banner.error { border-color:#e5c2bd; background:#fff4f2; color:var(--red); }
  </style>
</head>
<body>
  <header class="topbar">
    <button class="brand" data-view="home" aria-label="DeepCheck 홈"><span class="brand-mark">✓</span><span>Deep<strong>Check</strong></span></button>
    <nav class="desktop-nav" aria-label="주 메뉴">
      <button class="nav-item active" data-view="home">홈</button>
      <button class="nav-item" data-view="search">기업분석</button>
      <button class="nav-item" data-view="find">종목찾기</button>
      <button class="nav-item" data-view="watchlist">관심종목 <span class="nav-count" id="watch-count">2</span></button>
    </nav>
    <button class="login-btn" type="button" data-demo>로그인</button>
  </header>
  <main id="app"></main>
  <nav class="mobile-nav" aria-label="모바일 메뉴">
    <button class="nav-item active" data-view="home"><span>⌂</span>홈</button>
    <button class="nav-item" data-view="search"><span>⌕</span>검색</button>
    <button class="nav-item" data-view="find"><span>◇</span>종목찾기</button>
    <button class="nav-item" data-view="watchlist"><span>♡</span>관심종목</button>
  </nav>
  <script src="js/data.js"></script>
  <script src="js/components.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
